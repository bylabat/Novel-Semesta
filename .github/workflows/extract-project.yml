name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "Novel-Semesta-main.zip" -d extracted

          if [ -f "extracted/package.json" ]; then
            cp -a extracted/. ./project-temp
          else
            ROOT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$ROOT_DIR" ] && [ -f "$ROOT_DIR/package.json" ]; then
              cp -a "$ROOT_DIR"/. ./project-temp
            else
              echo "package.json tidak ditemukan di dalam ZIP"
              find extracted -maxdepth 3 -type f | head -100
              exit 1
            fi
          fi

      - name: Put project files in repository root
        run: |
          cp -a project-temp/. .
          rm -rf extracted project-temp
          rm -f "Novel-Semesta-main.zip"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Restore project from backup ZIP" || echo "Tidak ada perubahan"
          git push
